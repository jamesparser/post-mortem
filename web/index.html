<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POST-Mortem</title>
  <meta name="description" content="A proper funeral for dead devices." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene">
    <canvas id="petals" aria-hidden="true"></canvas>

    <header class="frame">
      <p class="kicker">A service in memory of</p>
      <h1 id="device-name">your device</h1>
    </header>

    <main id="stage">
      <section id="panel-name" class="panel">
        <p class="lead">Tell us what died.</p>
        <label class="field">
          <span class="label">The departed</span>
          <input id="input-name" type="text" maxlength="80"
                 placeholder="iPhone 12 with a cracked screen" autocomplete="off" />
        </label>
        <div class="row">
          <button id="btn-photo" class="ghost" type="button">Use a photo</button>
          <button id="btn-begin" class="primary" type="button">Begin the service</button>
        </div>
        <p id="photo-note" class="note" hidden></p>
        <input id="input-photo" type="file" accept="image/*" capture="environment" hidden />
      </section>

      <section id="panel-service" class="panel" hidden>
        <div id="casket" aria-hidden="true">
          <div class="lid"></div>
          <div class="box"></div>
          <div class="plate"><span id="plate-name">the departed</span></div>
        </div>
        <div id="grave" aria-hidden="true" hidden></div>
        <p id="eulogy" class="eulogy"></p>
        <div class="row">
          <button id="btn-replay" class="ghost" type="button">Replay</button>
        </div>
      </section>

      <section id="panel-done" class="panel" hidden>
        <p class="lead">Rest now.</p>
        <p class="closing">He will not be asked to update one more time.</p>
        <div class="row">
          <button id="btn-again" class="primary" type="button">Bury another</button>
          <a id="link-board" class="ghost link" href="ouija.html?mode=device">Ask the board</a>
        </div>
        <p class="note">On a Quest 3? Open this page in the headset browser and visit <a href="quest/">the haunting</a>.</p>
      </section>
    </main>

    <footer class="frame">
      <p class="kicker">POST-Mortem</p>
      <button id="btn-mute" class="ghost" type="button">Mute</button>
    </footer>
  </div>

  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
