<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POST-Mortem. The spirit board.</title>
  <meta name="description" content="A spirit board. Ask the dead, or ask the device you buried." />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <div id="room">
    <header id="top">
      <p class="kicker">POST-Mortem</p>
      <div id="modes" role="tablist" aria-label="Who to ask">
        <button id="mode-dead" role="tab" type="button" aria-selected="true">Talk to the dead</button>
        <button id="mode-device" role="tab" type="button" aria-selected="false">Your dead device</button>
      </div>
      <p id="mode-note">The board is open. Ask it anything.</p>
    </header>

    <form id="device-form" hidden>
      <label class="field">
        <span class="label">The departed</span>
        <input id="device-name" type="text" maxlength="80" placeholder="iPod classic" autocomplete="off" />
      </label>
      <label class="field">
        <span class="label">What took it</span>
        <input id="device-condition" type="text" maxlength="80" placeholder="a click wheel that stopped clicking" autocomplete="off" />
      </label>
      <button id="btn-summon" class="primary" type="submit">Reach it</button>
    </form>

    <div id="board-wrap">
      <canvas id="board" aria-label="A spirit board. The planchette spells the answer."></canvas>
    </div>
    <div id="caption" aria-live="polite"></div>
    <div id="whisper-layer" aria-hidden="true"></div>

    <div id="controls">
      <div class="ask-row">
        <input id="question" type="text" maxlength="120" placeholder="Is anyone there?" autocomplete="off" aria-label="Your question" />
        <button id="btn-ask" class="primary" type="button">Ask</button>
      </div>
      <div class="ask-row small">
        <button id="btn-mic" class="ghost" type="button">Use my voice</button>
        <button id="btn-goodbye" class="ghost" type="button">Good bye</button>
        <button id="btn-mute" class="ghost" type="button">Mute</button>
        <a class="ghost link" href="/">The gate</a>
      </div>
      <p id="hint">Headphones. Rest a finger on the planchette if you dare.</p>
    </div>

    <div id="closed" hidden>
      <p id="closed-line">The board is closed. It is not empty.</p>
      <button id="btn-again" class="ghost" type="button">Light the board again</button>
    </div>
  </div>

  <script src="board-canvas.js"></script>
  <script src="board-audio.js"></script>
  <script src="board-spirit.js"></script>
  <script src="board.js"></script>
</body>
</html>
